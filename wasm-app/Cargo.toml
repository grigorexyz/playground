[package]
name = "wasm-app"
version = "0.1.0"
edition = "2021"
description = "A Rust + WebAssembly + WebGPU simulated desktop, hosting a Comet shedding card game window (qlayground.net/games/view.php?slug=comet)."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
bytemuck = { version = "1", features = ["derive"] }
wgpu = { version = "30", default-features = false, features = ["webgpu", "wgsl"] }

[dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "Document",
  "Element",
  "HtmlCanvasElement",
  "DomRect",
  "PointerEvent",
  "console",
]

[profile.release]
opt-level = "s"
lto = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
