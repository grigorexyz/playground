[package]
name = "wasm-app"
version = "0.1.0"
edition = "2021"
description = "A Rust + WebAssembly prototype of the Comet shedding card game (qlayground.net/games/view.php?slug=comet)."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "Document",
  "Element",
  "HtmlButtonElement",
  "console",
]

[profile.release]
opt-level = "s"
lto = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
